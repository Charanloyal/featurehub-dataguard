# Lint configuration used by CI (`ruff check .`).
# Ruff's default rule set has grown in newer releases, so the rules are selected explicitly:
# CI results then stay the same when a newer Ruff version is installed.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Scripts, benchmarks, dashboards and tests put the repository root on sys.path before importing project modules.
"scripts/**" = ["E402"]
"**/benchmarks/**" = ["E402"]
"apps/**" = ["E402"]
"**/tests/**" = ["E402"]
# Pipeline endpoints are registered after the core API routes.
"dataguard/api/main.py" = ["E402"]
