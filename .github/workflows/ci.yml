name: Platform CI & Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    # The contract validation and schema-diff steps use the contract registry in Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform_admin
          POSTGRES_PASSWORD: platform_secure_pass
          POSTGRES_DB: featurehub_dataguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_admin -d featurehub_dataguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform_secure_pass
      POSTGRES_DB: featurehub_dataguard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Load Database Schema
        env:
          PGPASSWORD: platform_secure_pass
        run: psql -h localhost -U platform_admin -d featurehub_dataguard -v ON_ERROR_STOP=1 -f infrastructure/postgres/init.sql

      - name: Validate 25 Data Contracts
        run: |
          python scripts/create_contracts.py
          python dataguard/benchmarks/run_benchmarks.py

      - name: Run Schema Diff Engine & Check Breaking Changes
        run: |
          python -m pytest dataguard/tests/test_schema_diff.py -v
