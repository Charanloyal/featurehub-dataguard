name: Test Suite & Point-In-Time Leakage Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pytest-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Dev Environment
        run: python scripts/setup.py

      - name: Run Seed Data Generator
        run: python scripts/seed_data.py

      - name: Compute Offline Features
        run: python featurehub/computation/engine.py

      - name: Run Point-In-Time Correctness Tests
        run: python -m pytest featurehub/tests/test_pit.py -v

      - name: Run Full Test Suite
        run: python -m pytest tests/ featurehub/tests/ dataguard/tests/ -v --tb=short
