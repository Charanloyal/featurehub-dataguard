dataset: merchant_risk_features
version: v1.0.0
owner: featurestore-team
description: FeatureHub merchant historical fraud rates and velocity spikes
freshness_sla_minutes: 1440
constraints:
  min_rows: 50
  primary_key: merchant_id
columns:
- name: merchant_id
  type: string
  nullable: false
  unique: true
  description: Entity ID
- name: feature_timestamp
  type: timestamp
  nullable: false
  unique: false
  description: Observation time
- name: merch_risk_score
  type: float
  nullable: false
  unique: false
  description: Merchant score
  min: 0.0
  max: 1.0
- name: merch_fraud_rate_30d
  type: float
  nullable: false
  unique: false
  description: 30-day fraud rate
  min: 0.0
  max: 1.0
